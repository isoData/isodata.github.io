<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microlearning Selector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb; /* Light background */
        }
        /* Custom scrollbar for better mobile feel, though usually hidden */
        .card-container {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
        .card-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }
    </style>
</head>
<body class="min-h-screen pb-24">
    <div id="app" class="max-w-xl mx-auto p-4 md:p-6">
        <!-- Header -->
        <header class="flex items-center justify-between mb-8">
            <div class="text-3xl font-bold text-teal-600">NanoLearn</div>
            <!-- Profile Icon Placeholder -->
            <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-500 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
        </header>

        <!-- Prompt -->
        <h1 class="text-2xl font-bold text-gray-800 mb-2">What do you want to master next?</h1>
        <p class="text-gray-500 mb-8">Select 3 or more fields to build your personalized learning path.</p>

        <!-- Topic Cards Container -->
        <div id="topic-cards" class="grid grid-cols-2 gap-4 md:grid-cols-3 card-container">
            <!-- Cards will be injected here by JavaScript -->
        </div>

        <!-- Status/Error Message Box -->
        <div id="message-box" class="fixed inset-x-0 bottom-24 mx-auto p-3 max-w-sm bg-blue-500 text-white text-center rounded-lg shadow-xl hidden transition-opacity duration-300 z-20">
            <!-- Messages appear here -->
        </div>

    </div>

    <!-- Fixed Bottom Action Bar -->
    <div class="fixed bottom-0 inset-x-0 bg-white p-4 shadow-2xl border-t border-gray-100 z-10">
        <button id="continue-button" onclick="handleContinue()" disabled
                class="w-full py-4 text-white font-semibold rounded-xl transition-all duration-300
                       bg-teal-400 hover:bg-teal-500 disabled:bg-gray-300 disabled:cursor-not-allowed disabled:shadow-none shadow-lg shadow-teal-200">
            Continue (0 Selected)
        </button>
    </div>

    <script>
        // Global utility to show messages instead of alert()
        const showMessage = (text, type = 'info') => {
            const box = document.getElementById('message-box');
            box.textContent = text;

            // Define styles based on type
            let baseClasses = 'fixed inset-x-0 bottom-24 mx-auto p-3 max-w-sm text-white text-center rounded-lg shadow-xl z-20 transition-opacity duration-300';
            if (type === 'error') {
                box.className = `${baseClasses} bg-red-500`;
            } else if (type === 'success') {
                box.className = `${baseClasses} bg-green-500`;
            } else { // info/default
                box.className = `${baseClasses} bg-blue-500`;
            }

            box.classList.remove('hidden');
            setTimeout(() => {
                box.classList.add('hidden');
            }, 3000);
        };


        const topics = [
            { id: 'finance', name: 'Personal Finance & Money Management', emoji: '💰', color: 'bg-green-100', text: 'text-green-600', selected: false },
            { id: 'productivity', name: 'Productivity & Organization', emoji: '🚀', color: 'bg-purple-100', text: 'text-purple-600', selected: false },
            { id: 'communication', name: 'Communication & Soft Skills', emoji: '🗣️', color: 'bg-blue-100', text: 'text-blue-600', selected: false },
            { id: 'critical', name: 'Critical Thinking & Problem Solving', emoji: '🤔', color: 'bg-yellow-100', text: 'text-yellow-600', selected: false },
            { id: 'health', name: 'Health & Everyday Wellness', emoji: '🍎', color: 'bg-red-100', text: 'text-red-600', selected: false },
            { id: 'digital', name: 'Digital Literacy & Tech Skills', emoji: '💻', color: 'bg-indigo-100', text: 'text-indigo-600', selected: false },
            { id: 'life', name: 'Everyday Life Skills', emoji: '💡', color: 'bg-pink-100', text: 'text-pink-600', selected: false },
            { id: 'civic', name: 'Civic & Practical Knowledge', emoji: '🏛️', color: 'bg-teal-100', text: 'text-teal-600', selected: false },
        ];

        let selectedTopics = [];

        /**
         * Renders the topic cards onto the page.
         */
        function renderCards() {
            const container = document.getElementById('topic-cards');
            container.innerHTML = ''; // Clear existing cards

            topics.forEach(topic => {
                const isSelected = selectedTopics.includes(topic.id);

                const cardHtml = `
                    <div id="card-${topic.id}"
                         onclick="toggleSelection('${topic.id}')"
                         class="
                            ${topic.color} ${topic.text}
                            p-4 rounded-xl flex flex-col justify-between h-40 transition-all duration-200 cursor-pointer shadow-md border-2
                            ${isSelected ? 'border-teal-500 ring-4 ring-teal-200 scale-105' : 'border-transparent hover:shadow-lg hover:scale-[1.02]'}
                         ">
                        <div class="text-4xl mb-2">${topic.emoji}</div>
                        <p class="font-semibold text-sm leading-snug">${topic.name}</p>
                        ${isSelected ? `
                            <div class="absolute top-2 right-2 p-1 bg-teal-500 rounded-full text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"/></svg>
                            </div>
                        ` : ''}
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
            updateContinueButton();
        }

        /**
         * Toggles the selection state of a topic card.
         * @param {string} topicId - The ID of the topic to toggle.
         */
        function toggleSelection(topicId) {
            const index = selectedTopics.indexOf(topicId);

            if (index > -1) {
                // Deselect
                selectedTopics.splice(index, 1);
            } else {
                // Select
                selectedTopics.push(topicId);
            }
            // Re-render to update classes and icons
            renderCards();
        }

        /**
         * Updates the text and enabled state of the Continue button.
         */
        function updateContinueButton() {
            const button = document.getElementById('continue-button');
            const count = selectedTopics.length;
            const minRequired = 3;

            button.textContent = `Continue (${count} Selected)`;

            if (count >= minRequired) {
                button.disabled = false;
            } else {
                button.disabled = true;
                if (count > 0) {
                     button.textContent = `Select ${minRequired - count} more to continue`;
                }
            }
        }

        /**
         * Simulates the API call upon clicking 'Continue'.
         */
        function handleContinue() {
            if (selectedTopics.length < 3) {
                showMessage('Please select at least 3 topics to start.', 'error');
                return;
            }

            showMessage('Preparing your personalized learning path...', 'info');

            // --- LLM API INTERACTION SIMULATION START ---
            // In a real application, we would prepare a payload to ask the LLM
            // to generate initial learning content based on the selected fields.

            const userSelectedFields = topics
                .filter(t => selectedTopics.includes(t.id))
                .map(t => t.name);

            const systemPrompt = "You are an expert microlearning curriculum designer. Given the user's selected fields, generate a welcoming introduction and a list of 5 introductory micro-lessons (topics, goal, and estimated time) tailored to their interests. The tone should be encouraging and concise.";
            const userQuery = `The user has selected the following fields for their personalized learning path: ${userSelectedFields.join(', ')}. Generate the introductory content and lesson plan.`;
            const apiKey = "" // Leave as-is

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                },
                // Note: The LLM model will be gemini-2.5-flash-preview-09-2025 by default here.
            };

            console.log("--- Simulated API Payload for LLM ---");
            console.log("Endpoint: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent");
            console.log("Payload:", payload);
            console.log("--------------------------------------");

            // Simulate navigation/success after a delay
            setTimeout(() => {
                showMessage('Success! Your personalized feed is ready.', 'success');
                // document.location.href = '/dashboard'; // Real-world navigation
            }, 1500);

            // --- LLM API INTERACTION SIMULATION END ---
        }

        // Initialize the app on load
        window.onload = function() {
            renderCards();
        };

    </script>
</body>
</html>
