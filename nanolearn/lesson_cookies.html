<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Cookies Lesson</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        /* Custom styles for quiz options */
        .quiz-option {
            transition: all 0.2s ease-in-out;
        }
        .quiz-option.correct {
            background-color: #dcfce7; /* green-100 */
            border-color: #22c55e; /* green-500 */
            color: #166534; /* green-800 */
        }
        .quiz-option.incorrect {
            background-color: #fee2e2; /* red-100 */
            border-color: #ef4444; /* red-500 */
            color: #991b1b; /* red-800 */
        }
        .quiz-option.disabled {
            pointer-events: none;
            opacity: 0.8;
        }
    </style>
</head>
<body class="min-h-screen pb-24">
    <div id="app" class="max-w-xl mx-auto p-4 md:p-6">

        <!-- Header -->
        <header class="flex items-center justify-between pt-2 pb-6">
            <button onclick="history.back()" class="flex items-center text-teal-600 hover:text-teal-700 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x"><path d="M18 6 6 18M6 6l12 12"/></svg>
                <span class="font-semibold text-lg ml-1">Exit Lesson</span>
            </button>
            <span id="progress-text" class="text-sm font-semibold text-gray-500">Step 1 / 3</span>
        </header>

        <!-- Progress Bar -->
        <div class="w-full bg-gray-200 rounded-full h-2.5 mb-6">
            <div id="progress-bar" class="bg-teal-500 h-2.5 rounded-full transition-all duration-300" style="width: 33.3%"></div>
        </div>

        <!-- Lesson Content Area -->
        <div id="lesson-content">
            
            <!-- Step 1: Overview -->
            <div id="step-1-overview">
                <h1 class="text-3xl font-bold text-gray-800 mb-6">
                    <strong>🍪 Understanding Web Cookies</strong>
                </h1>
                <p class="text-lg text-gray-700 leading-relaxed"></p>
            </div>

            <!-- Step 2: Concepts -->
            <div id="step-2-concepts" class="hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">Why Cookies Matter</h2>
                <div id="concepts-list" class="space-y-3">
                    <!-- Concepts will be injected here -->
                </div>
            </div>

            <!-- Step 3: Quiz -->
            <div id="step-3-quiz" class="hidden">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Knowledge Check</h2>
                <p id="question-text" class="text-lg text-gray-700 mb-6"></p>
                <div id="options-container" class="space-y-3">
                    <!-- Options will be injected here -->
                </div>
            </div>

            <!-- Step 4: Complete -->
            <div id="step-4-complete" class="hidden text-center py-12">
                <span class="text-7xl mb-6 block">🎉</span>
                <h2 class="text-3xl font-bold text-gray-800 mb-4">Lesson Complete!</h2>
                <p class="text-lg text-gray-600 mb-8">You've learned the basics of web cookies. Great job!</p>
                <p class="text-lg font-semibold text-teal-600" id="quiz-score"></p>
            </div>

        </div>

    </div>

    <!-- Fixed Bottom Action Bar - NOW CENTERED -->
    <div class="fixed bottom-0 inset-x-0 bg-white shadow-2xl border-t border-gray-100 z-10">
        <div class="max-w-xl mx-auto p-4">
            <button id="main-button" onclick="handleMainButton()"
                    class="w-full py-4 text-white font-semibold rounded-xl transition-all duration-300
                           bg-teal-500 hover:bg-teal-600 disabled:bg-gray-300 disabled:cursor-not-allowed">
                Next: Key Concepts
            </button>
        </div>
    </div>

    <script>
        // The lesson data provided by the user
        const lessonData = {
          "lesson": {
            "title": "Understanding Web Cookies",
            "description": "A cookie is a small piece of data that a website stores on your device to remember information about you — like login status, preferences, or what’s in your shopping cart.",
            "importance": [
              { "point": "Personalization", "description": "Cookies help websites remember your settings and preferences, making your experience smoother." },
              { "point": "Session Management", "description": "They keep you logged in as you move from page to page on a website." },
              { "point": "Analytics and Tracking", "description": "Websites use cookies to understand how visitors use their site and improve performance." },
              { "point": "Advertising and Targeting", "description": "Cookies allow advertisers to show you more relevant ads based on your online behavior." }
            ],
            "quiz": [
              { "question": "What kind of information does a cookie typically store on your device?", "options": ["Your full internet history and personal files", "Small bits of website data like login status or preferences", "Software updates and security patches", "A copy of every webpage you visit"], "correct_answer": "Small bits of website data like login status or preferences" },
              { "question": "How do cookies improve your experience when visiting a website?", "options": ["They increase your internet speed", "They allow websites to remember your settings and keep you logged in", "They block unwanted pop-ups automatically", "They delete your browsing data after every session"], "correct_answer": "They allow websites to remember your settings and keep you logged in" },
              { "question": "Why is it important to understand how cookies track your activity online?", "options": ["Because cookies can replace antivirus software", "Because they can help you hack websites", "Because they affect your privacy and control over personal data", "Because they slow down your device permanently"], "correct_answer": "Because they affect your privacy and control over personal data" }
            ]
          }
        };

        // UI Elements
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const mainButton = document.getElementById('main-button');
        
        const step1 = document.getElementById('step-1-overview');
        const step2 = document.getElementById('step-2-concepts');
        const step3 = document.getElementById('step-3-quiz');
        const step4 = document.getElementById('step-4-complete');

        // State
        let currentStep = 1;
        let currentQuestionIndex = 0;
        let score = 0;
        let answerSelected = false;

        /**
         * Initializes the lesson by populating the first step.
         */
        function initLesson() {
            step1.querySelector('p').textContent = lessonData.lesson.description;
        }

        /**
         * Main navigation logic
         */
        function handleMainButton() {
            switch (currentStep) {
                case 1:
                    // Move to Step 2: Concepts
                    currentStep = 2;
                    showStep(step2);
                    renderConcepts();
                    updateProgress(2, 'Next: Quiz');
                    break;
                case 2:
                    // Move to Step 3: Quiz
                    currentStep = 3;
                    showStep(step3);
                    renderQuizQuestion();
                    updateProgress(3, 'Select an Answer');
                    mainButton.disabled = true;
                    break;
                case 3:
                    // This button handles "Next Question"
                    answerSelected = false;
                    currentQuestionIndex++;
                    if (currentQuestionIndex < lessonData.lesson.quiz.length) {
                        renderQuizQuestion();
                        mainButton.textContent = 'Select an Answer';
                        mainButton.disabled = true;
                    } else {
                        // End of quiz
                        currentStep = 4;
                        showStep(step4);
                        renderCompletion();
                    }
                    break;
                case 4:
                    // "Finish Lesson" button
                    history.back(); // Go back to the profile page
                    break;
            }
        }

        /**
         * Hides all step divs and shows the target one
         */
        function showStep(stepElement) {
            [step1, step2, step3, step4].forEach(el => el.classList.add('hidden'));
            stepElement.classList.remove('hidden');
        }

        /**
         * Updates the progress bar and main button text
         */
        function updateProgress(step, buttonText) {
            const progress = (step / 3) * 100;
            progressBar.style.width = `${progress}%`;
            progressText.textContent = `Step ${step} / 3`;
            mainButton.textContent = buttonText;
        }

        /**
         * Renders the list of concepts for Step 2
         */
        function renderConcepts() {
            const list = document.getElementById('concepts-list');
            list.innerHTML = ''; // Clear old content
            lessonData.lesson.importance.forEach(item => {
                const html = `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <p class="font-semibold text-gray-800 text-lg">${item.point}</p>
                        <p class="text-gray-600">${item.description}</p>
                    </div>
                `;
                list.insertAdjacentHTML('beforeend', html);
            });
        }

        /**
         * Renders the current quiz question and options
         */
        function renderQuizQuestion() {
            const question = lessonData.lesson.quiz[currentQuestionIndex];
            document.getElementById('question-text').textContent = question.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; // Clear old options
            
            question.options.forEach(option => {
                const html = `
                    <div onclick="selectAnswer(this, '${option}')" 
                         class="quiz-option bg-white p-4 rounded-xl shadow-sm border-2 border-transparent cursor-pointer hover:border-teal-300">
                        <p class="text-gray-700 font-medium">${option}</p>
                    </div>
                `;
                optionsContainer.insertAdjacentHTML('beforeend', html);
            });
        }

        /**
         * Handles the logic when a user clicks a quiz option
         */
        function selectAnswer(selectedElement, selectedOption) {
            if (answerSelected) return; // Prevent multiple clicks
            answerSelected = true;

            const question = lessonData.lesson.quiz[currentQuestionIndex];
            const correctAnswer = question.correct_answer;
            const options = document.querySelectorAll('.quiz-option');

            if (selectedOption === correctAnswer) {
                selectedElement.classList.add('correct');
                score++;
            } else {
                selectedElement.classList.add('incorrect');
            }

            // Disable all options and show the correct one
            options.forEach(opt => {
                opt.classList.add('disabled');
                if (opt.textContent.trim() === correctAnswer) {
                    opt.classList.add('correct');
                }
            });

            // Update button
            mainButton.disabled = false;
            if (currentQuestionIndex < lessonData.lesson.quiz.length - 1) {
                mainButton.textContent = 'Next Question';
            } else {
                mainButton.textContent = 'Finish Lesson';
            }
        }

        /**
         * Renders the final completion screen
         */
        function renderCompletion() {
            document.getElementById('quiz-score').textContent = `Your Score: ${score} / ${lessonData.lesson.quiz.length}`;
            mainButton.textContent = 'Back to Dashboard';
            mainButton.classList.remove('bg-teal-500', 'hover:bg-teal-600');
            mainButton.classList.add('bg-gray-700', 'hover:bg-gray-800');
            progressText.textContent = 'Complete!';
            progressBar.style.width = '100%';
        }

        // Start the lesson
        window.onload = initLesson;
    </script>
</body>
</html>
