<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case:Zero - A Film Noir Detective Mystery</title>
    <style>
        /* Import Film Noir-esque fonts */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IBM+Plex+Mono:wght@300;400;700&display=swap');

        body {
            margin: 0;
            font-family: 'IBM Plex Mono', monospace;
            color: #d0d0d0;
            /* UPDATED: Using the GIF background */
            background-image: url('https://i.imgur.com/G3cLxS8.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
            overflow: hidden;
            filter: grayscale(10%) contrast(110%);
        }

        /* Stronger, grittier overlay for noir feel */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }

        /* --- FADE IN ANIMATIONS --- */
        @keyframes fadeInMove {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        h1 {
            position: relative; /* Ensure h1 is above the overlay */
            z-index: 2;
            font-family: 'Cinzel Decorative', cursive;
            font-weight: 700;
            font-size: 3em;
            margin-bottom: 10px;
            color: #f0f0f0;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3), 0 0 20px rgba(0, 0, 0, 0.9);
            letter-spacing: 2px;
            text-transform: uppercase;
            /* Initial state and animation for title */
            opacity: 0;
            animation: fadeInMove 2s ease-out 0.5s forwards; /* Start after 0.5s, lasts 2s */
        }

        p {
            position: relative; /* Ensure p is above the overlay */
            z-index: 2;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            margin-bottom: 40px;
            line-height: 1.6;
            text-shadow: 1px 1px #000;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            font-weight: bolder;
            /* Animation for description text */
            opacity: 0;
            animation: fadeInMove 1.5s ease-out 2.5s forwards; /* Starts after title finishes */
        }

        /* --- Button Styling --- */
        .btn {
            position: relative;
            z-index: 2;
            display: inline-block;
            background-color: #333;
            color: #f0f0f0;
            padding: 18px 35px;
            
            /* UPDATED: Thicker border and gold color for stronger visual emphasis */
            border: 3px solid #FFAC47; 
            
            border-radius: 0;
            text-decoration: none;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.3em;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            box-shadow: 4px 4px 0px #000;
            letter-spacing: 1px;
            text-transform: uppercase;
            
            /* Initially hidden via JS/CSS class, but reserve space */
            opacity: 0; 
            pointer-events: none; /* Disable clicks until visible */
            transform: scale(0.9);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .btn.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .btn:hover {
            background-color: #444;
            color: #FFAC47;
            border-color: #FFAC47;
            box-shadow: 6px 6px 0px #000;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 600px) {
            h1 {
                font-size: 2.2em;
                letter-spacing: 1px;
            }
            p {
                font-size: 0.9em;
                margin-bottom: 30px;
            }
            .btn {
                font-size: 1.1em;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>
    <h1>Case:Zero</h1>
    <p>In the city's shadowed alleys, every whisper hides a lie, every silhouette a secret. Todays case awaits, detective.</p>
    <a href="game.html" id="beginBtn" class="btn">Begin Investigation</a>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const beginBtn = document.getElementById('beginBtn');
            // Delay the appearance of the button significantly (e.g., 4 seconds total)
            const delayTime = 4000; 

            setTimeout(() => {
                beginBtn.classList.add('visible');
            }, delayTime);
        });
    </script>
</body>
</html>
